name: Portal CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx oxlint src || true
      - run: npm run build
        env:
          VITE_CONVEX_URL: ${{ vars.CONVEX_URL }}
